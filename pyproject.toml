[project]
name = "lilite"
version = "0.1.0"
description = "LI Lite — a lighter LinkedIn, powered by browser discovery + Chrome extension"
requires-python = ">=3.12"
dependencies = [
    "patchright>=1.52.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
